<script>
/* =========================================================
   WEBSTRIKE - ÖZGÜN INDUSTRIAL DISTRICT HARİTASI
   KARAKTER ÖLÇEĞİ:
   Oyuncu boyu: yaklaşık 1.6 metre
   Kapılar: yaklaşık 2.2 metre
   Duvarlar: yaklaşık 3 metre
   Kutular: yaklaşık 1 metre
========================================================= */

const mapObjects = [];

/* -------------------------
   GENEL OBJE OLUŞTURUCU
------------------------- */

function createMapBox(
    x,
    y,
    z,
    width,
    height,
    depth,
    color = 0x777777,
    name = "object"
){

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: color,
            roughness: .8,
            metalness: .05
        });

    const object =
        new THREE.Mesh(
            geometry,
            material
        );

    object.position.set(
        x,
        y,
        z
    );

    object.castShadow = true;
    object.receiveShadow = true;

    object.userData.mapObject = true;
    object.userData.name = name;

    scene.add(object);

    mapObjects.push(object);

    return object;
}


/* -------------------------
   ZEMİN
------------------------- */

function createGround(){

    const ground =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                100,
                100
            ),

            new THREE.MeshStandardMaterial({
                color:0x68645d,
                roughness:1
            })

        );

    ground.rotation.x =
        -Math.PI / 2;

    ground.receiveShadow = true;

    scene.add(ground);

}


/* -------------------------
   DUVAR
------------------------- */

function createMapWall(
    x,
    z,
    width,
    depth,
    height = 3,
    color = 0x777777
){

    return createMapBox(
        x,
        height / 2,
        z,
        width,
        height,
        depth,
        color,
        "wall"
    );

}


/* -------------------------
   KUTU
------------------------- */

function createCrate(
    x,
    z,
    size = 1
){

    const colors = [
        0x7a4b25,
        0x8b5a2b,
        0x6d4324
    ];

    const color =
        colors[
            Math.floor(
                Math.random() *
                colors.length
            )
        ];

    return createMapBox(
        x,
        size / 2,
        z,
        size,
        size,
        size,
        color,
        "crate"
    );

}


/* -------------------------
   KONTEYNER
------------------------- */

function createContainer(
    x,
    z,
    color
){

    const container =
        createMapBox(
            x,
            1.3,
            z,
            5,
            2.6,
            2.2,
            color,
            "container"
        );

    /* Kapı çizgisi */

    createMapBox(
        x,
        1.3,
        z - 1.12,
        3.5,
        2.2,
        .04,
        0x222222,
        "container-door"
    );

    return container;

}


/* -------------------------
   ARAÇ
------------------------- */

function createVehicle(
    x,
    z
){

    /* Gövde */

    createMapBox(
        x,
        .75,
        z,
        3.5,
        1.1,
        1.7,
        0x263238,
        "vehicle"
    );

    /* Kabin */

    createMapBox(
        x + .3,
        1.35,
        z,
        1.5,
        .8,
        1.5,
        0x37474f,
        "vehicle-cabin"
    );

    /* Tekerlekler */

    const wheelPositions = [
        [-1.1,-.9],
        [-1.1,.9],
        [1.1,-.9],
        [1.1,.9]
    ];

    wheelPositions.forEach(
        pos=>{

            const wheel =
                new THREE.Mesh(

                    new THREE.CylinderGeometry(
                        .35,
                        .35,
                        .25,
                        12
                    ),

                    new THREE.MeshStandardMaterial({
                        color:0x111111
                    })

                );

            wheel.rotation.z =
                Math.PI / 2;

            wheel.position.set(
                x + pos[0],
                .4,
                z + pos[1]
            );

            wheel.castShadow = true;

            scene.add(wheel);

        }
    );

}


/* -------------------------
   AĞAÇ
------------------------- */

function createTree(
    x,
    z
){

    /* Gövde */

    createMapBox(
        x,
        1.2,
        z,
        .5,
        2.4,
        .5,
        0x5d3a1f,
        "tree-trunk"
    );

    /* Yaprak */

    const leaves =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                1.5,
                12,
                10
            ),

            new THREE.MeshStandardMaterial({
                color:0x245c32
            })

        );

    leaves.position.set(
        x,
        3,
        z
    );

    leaves.castShadow = true;

    scene.add(leaves);

}


/* =========================================================
   BİNA
========================================================= */

function createBuilding(
    x,
    z,
    width,
    depth,
    color
){

    /* Arka duvar */

    createMapWall(
        x,
        z - depth / 2,
        width,
        .4,
        3,
        color
    );

    /* Sol duvar */

    createMapWall(
        x - width / 2,
        z,
        .4,
        depth,
        3,
        color
    );

    /* Sağ duvar */

    createMapWall(
        x + width / 2,
        z,
        .4,
        depth,
        3,
        color
    );

    /*
    Ön taraf tamamen kapatılmıyor.
    Böylece oyuncu binaya girebilir.
    */

    /* İç bölme */

    createMapWall(
        x,
        z,
        .25,
        depth - 2,
        2.7,
        color
    );

}


/* =========================================================
   ANA HARİTA
========================================================= */

function createMap(){

    /* Eski harita varsa temizle */

    mapObjects.forEach(

    mapObjects.length = 0;

    ========================================================
    DIŞ SINIRLAR
    ========================================================
    */

    );

    createMapWall(
        0,
        48,
        96,
        1,
        3
    );

    createMapWall(
        -48,
        0,
        1,
        96,
        3
    );

    createMapWall(
        48,
        0,
        1,
        96,
        3
    );


    /*
    ========================================================
    MERKEZ FABRİKA
    ========================================================
    */

    createBuilding(
        0,
        -5,
        22,
        18,
        0x55585a
    );


    /*
    FABRİKA GİRİŞİ
    */

    createMapWall(
        -6,
        -14,
        5,
        .5,
        3,
        0x55585a
    );

    createMapWall(
        6,
        -14,
        5,
        .5,
        3,
        0x55585a
    );


    /*
    FABRİKA İÇ KUTULARI
    */

    createCrate(
        -4,
        -5,
        1.2
    );

    createCrate(
        -2.7,
        -5,
        1.2
    );

    createCrate(
        4,
        -5,
        1.2
    );

    createCrate(
        4,
        -3.8,
        1.2
    );


    /*
    ========================================================
    SOL DEPO
    ========================================================
    */

    createBuilding(
        -30,
        5,
        15,
        20,
        0x77736c
    );


    /* Depo iç kasaları */

    createCrate(
        -33,
        2
    );

    createCrate(
        -32,
        3
    );

    createCrate(
        -31,
        4
    );

    createCrate(
        -27,
        8
    );

    createCrate(
        -28,
        8
    );


    /*
    ========================================================
    SAĞ OFİS BİNASI
    ========================================================
    */

    createBuilding(
        30,
        5,
        14,

    /* Ofis masası */

    createMapBox(

    );


    /*
    ========================================================
    KONTEYNER BÖLGESİ
    ========================================================
    */

    createContainer(
        -28,
        -25,
        0x263f6b
    );

    createContainer(
        -22,
        -25,
        0x6b2929
    );

    createContainer(
        -16,
        -25,
        0x315c3b
    );


    /*
    ========================================================
    AÇIK ALAN
    ========================================================
    */

    createMapBox(
        0,
        .5,
        20,
        12,
        1,
        5,
        0x555555,
        "cover"
    );


    createCrate(
        -5,
        20,
        1.2
    );

    createCrate(
        5,

    );


    /*
    ========================================================
    ARAÇLAR
    ========================================================
    */

    createVehicle(

    createVehicle(

    );


    /*
    ========================================================
    KÜÇÜK KONTROL NOKTASI
    ========================================================
    */

    createMapWall(
        18,
        8,
        8,
        .4,
        2.5,
        0x4b4b4b
    );

    createMapWall(
        22,

        .4,
        8,
        2.5,
        0x4b4b4b
    );


    createCrate(
        19,
        10
    );

    createCrate(
        21,
        10
    );


    /*
    ========================================================
    ORMAN / YEŞİL ALAN
    ========================================================
    */

    createTree(
        -38,
        30
    );

    createTree(
        -32,
        35
    );

    createTree(
        -25,
        32
    );

    createTree(
        38,

    );

    createTree(
        35,

    /*
    ========================================================

    ========================================================
    */

    createMapWall(

    /*

    createMapBox(
        -12,
        1,
        5,

        1,
        0x5d5d5d,
        "center-cover"
    );

    createMapBox(
        12,
        1,
        5,
        5,
        2,
        1,
        0x5d5d5d,
        "center-cover"
    );


    /*
    ========================================================
    SPAWN ALANLARI
    ========================================================
    */

    createMapBox(
        -35,
        .1,
        -38,
        10,
        .2,
        6,
        0x234d35,
        "spawn-zone"
    );

    createMapBox(
        35,
        .1,
        38,
        10,
        .2,

        0x4d2323,
        "spawn-zone"
    );

}


/* =========================================================
   GELİŞTİRİLMİŞ SES SİSTEMİ
========================================================= */

let audioContext = null;


function initAudio(){

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

}


/* -------------------------
   ATEŞ SESİ
------------------------- */

function playShootSound(){

    initAudio();

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }


    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type =
        "sawtooth";

    oscillator.frequency.setValueAtTime(
        150,
        audioContext.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        45,
        audioContext.currentTime + .12
    );

    gain.gain.setValueAtTime(
        .35,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + .12
    );

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + .12
    );

}


/* -------------------------
   BOŞ ŞARJÖR
------------------------- */

function playEmptySound(){

    initAudio();

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.frequency.value =
        180;

    gain.gain.value =
        .15;

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + .08
    );

}


/* -------------------------
   YENİDEN DOLDURMA
------------------------- */

function playReloadSound(){

    initAudio();

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type =
        "square";

    oscillator.frequency.value =
        300;

    gain.gain.value =
        .08;

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.start();

    setTimeout(
        ()=>{
            oscillator.stop();
        },
        180
    );

}


/* -------------------------
   ATEŞ FONKSİYONUNA SES EKLE
------------------------- */

const originalShoot =
    shoot;

shoot=function(){

    if(ammo<=0){

        playEmptySound();

        originalShoot();

        return;

    }

    playShootSound();

    originalShoot();

};


/* -------------------------
   RELOAD FONKSİYONUNA SES
------------------------- */

const originalReload =
    reload;

reload=function(){

    if(
        !reloading &&
        ammo < 30 &&
        reserveAmmo > 0
    ){

        playReloadSound();

    }

    originalReload();

};

</script>
