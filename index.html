<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>WebStrike FPS</title>

<style>

/* =========================================
   GENEL
========================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #080b0f;

    font-family:
        Arial,
        sans-serif;

}


/* =========================================
   CANVAS
========================================= */

#game {

    position: fixed;

    inset: 0;

    width: 100%;

    height: 100%;

}


/* =========================================
   TÜM MENÜLER
========================================= */

.menu {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    justify-content: center;

    align-items: center;

    background:

        radial-gradient(

            circle,

            #243c55,

            #05070a 75%

        );

}


.menuBox {

    width: 460px;

    max-width: 92%;

    padding: 35px;

    color: white;

    text-align: center;

    background:

        rgba(

            10,

            15,

            22,

            .97

        );

    border:

        1px solid

        rgba(

            255,

            255,

            255,

            .15

        );

    border-radius: 18px;

    box-shadow:

        0 20px 80px

        rgba(

            0,

            0,

            0,

            .8

        );

}


.menuBox h1 {

    font-size: 42px;

    letter-spacing: 5px;

    margin-bottom: 10px;

}


.menuBox h2 {

    margin-bottom: 25px;

}


.menuButton {

    width: 100%;

    padding: 15px;

    margin-top: 10px;

    border: none;

    border-radius: 8px;

    background: #e63946;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

}


.menuButton:hover {

    background: #ff5965;

}


.backButton {

    background: #39424d;

}


.backButton:hover {

    background: #4d5965;

}


/* =========================================
   SEÇİM BUTONLARI
========================================= */

.option {

    width: 100%;

    padding: 14px;

    margin-top: 10px;

    border:

        1px solid

        #454d56;

    border-radius: 8px;

    background: #171d24;

    color: white;

    cursor: pointer;

}


.option.active {

    border-color: #e63946;

    background: #64252b;

}


.option:hover {

    background: #252d36;

}


select {

    width: 100%;

    padding: 14px;

    margin-top: 10px;

    border-radius: 8px;

    border:

        1px solid

        #454d56;

    background: #171d24;

    color: white;

    font-size: 16px;

}


input {

    width: 100%;

    padding: 14px;

    margin-top: 10px;

    border-radius: 8px;

    border:

        1px solid

        #454d56;

    background: #171d24;

    color: white;

    text-align: center;

    font-size: 17px;

    text-transform: uppercase;

}


#roomMessage {

    min-height: 25px;

    margin-top: 15px;

    color: #55e68a;

}


/* =========================================
   HARİTA KARTLARI
========================================= */

.maps {

    display: grid;

    grid-template-columns:

        1fr 1fr;

    gap: 10px;

}


.mapCard {

    padding: 20px;

    border:

        2px solid

        #333;

    border-radius: 10px;

    background: #161c22;

    cursor: pointer;

}


.mapCard.active {

    border-color:

        #e63946;

}


.mapCard:hover {

    background:

        #222b34;

}


.mapIcon {

    font-size: 35px;

    margin-bottom: 8px;

}


/* =========================================
   HUD
========================================= */

#hud {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 20;

    color: white;

    pointer-events: none;

}


#fps {

    position: absolute;

    top: 15px;

    left: 15px;

    padding: 8px 12px;

    background:

        rgba(

            0,

            0,

            0,

            .55

        );

    border-radius: 6px;

}


#roomInfo {

    position: absolute;

    top: 55px;

    left: 15px;

    padding: 7px 12px;

    background:

        rgba(

            0,

            0,

            0,

            .55

        );

    border-radius: 6px;

    font-size: 13px;

}


#score {

    position: absolute;

    top: 20px;

    right: 20px;

    padding: 10px 15px;

    background:

        rgba(

            0,

            0,

            0,

            .55

        );

    border-radius: 7px;

}


#crosshair {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 22px;

    height: 22px;

    transform:

        translate(

            -50%,

            -50%

        );

}


#crosshair::before {

    content: "";

    position: absolute;

    left: 10px;

    width: 2px;

    height: 22px;

    background: white;

}


#crosshair::after {

    content: "";

    position: absolute;

    top: 10px;

    width: 22px;

    height: 2px;

    background: white;

}


#stats {

    position: absolute;

    left: 20px;

    bottom: 20px;

    width: 220px;

    padding: 15px;

    background:

        rgba(

            0,

            0,

            0,

            .65

        );

    border-radius: 10px;

}


#health-bar {

    width: 100%;

    height: 12px;

    margin-top: 8px;

    background: #333;

    border-radius: 8px;

    overflow: hidden;

}


#health-fill {

    width: 100%;

    height: 100%;

    background: #28d66c;

}


#ammo {

    position: absolute;

    right: 25px;

    bottom: 25px;

    font-size: 28px;

    font-weight: bold;

}


/* =========================================
   SİLAH
========================================= */

#weapon {

    position: absolute;

    right: 7%;

    bottom: 0;

    width: 330px;

    height: 170px;

}


.weapon-main {

    position: absolute;

    right: 20px;

    bottom: 50px;

    width: 240px;

    height: 50px;

    background: #1b1b1b;

    border-radius: 8px;

}


.weapon-barrel {

    position: absolute;

    right: 250px;

    bottom: 67px;

    width: 100px;

    height: 15px;

    background: #090909;

}


.weapon-handle {

    position: absolute;

    right: 80px;

    bottom: -5px;

    width: 55px;

    height: 85px;

    background: #222;

    transform: rotate(12deg);

}


.weapon-mag {

    position: absolute;

    right: 160px;

    bottom: 5px;

    width: 35px;

    height: 75px;

    background: #111;

    transform: rotate(12deg);

}


#muzzle {

    display: none;

    position: absolute;

    right: calc(7% + 345px);

    bottom: 75px;

    width: 35px;

    height: 35px;

    background: #ffb000;

    border-radius: 50%;

    box-shadow:

        0 0 15px #ff6600,

        0 0 40px #ff9900;

}


</style>

</head>


<body>


<!-- =========================================
     ANA MENÜ
========================================= -->

<div
    id="mainMenu"
    class="menu"
>

    <div class="menuBox">

        <h1>
            WEBSTRIKE
        </h1>

        <p>
            Multiplayer FPS
        </p>

        <button
            class="menuButton"
            id="playButton"
        >
            OYNA
        </button>

        <button
            class="menuButton"
            id="mapButton"
        >
            HARİTA SEÇ
        </button>

        <button
            class="menuButton"
            id="enemyButton"
        >
            DÜŞMAN AYARLARI
        </button>

    </div>

</div>


<!-- =========================================
     HARİTA MENÜSÜ
========================================= -->

<div
    id="mapMenu"
    class="menu"
    style="display:none"
>

    <div class="menuBox">

        <h2>
            HARİTA SEÇ
        </h2>

        <div class="maps">

            <div
                class="mapCard active"
                data-map="training"
            >

                <div class="mapIcon">
                    🏕️
                </div>

                <b>
                    Eğitim Alanı
                </b>

                <p>
                    Açık ve geniş alan
                </p>

            </div>


            <div
                class="mapCard"
                data-map="city"
            >

                <div class="mapIcon">
                    🏙️
                </div>

                <b>
                    Şehir
                </b>

                <p>
                    Binalı savaş alanı
                </p>

            </div>


            <div
                class="mapCard"
                data-map="desert"
            >

                <div class="mapIcon">
                    🏜️
                </div>

                <b>
                    Çöl
                </b>

                <p>
                    Açık çöl haritası
                </p>

            </div>


            <div
                class="mapCard"
                data-map="forest"
            >

                <div class="mapIcon">
                    🌲
                </div>

                <b>
                    Orman
                </b>

                <p>
                    Ağaçlık bölge
                </p>

            </div>

        </div>


        <button
            class="menuButton backButton"
            id="mapBack"
        >
            GERİ
        </button>

    </div>

</div>


<!-- =========================================
     DÜŞMAN AYARLARI
========================================= -->

<div
    id="enemyMenu"
    class="menu"
    style="display:none"
>

    <div class="menuBox">

        <h2>
            DÜŞMAN AYARLARI
        </h2>


        <button
            id="botsOff"
            class="option active"
        >
            DÜŞMANLAR KAPALI
        </button>


        <button
            id="botsOn"
            class="option"
        >
            DÜŞMANLAR AÇIK
        </button>


        <select id="botCount">

            <option value="1">
                1 Düşman
            </option>

            <option value="3">
                3 Düşman
            </option>

            <option value="5">
                5 Düşman
            </option>

            <option value="10">
                10 Düşman
            </option>

            <option value="20">
                20 Düşman
            </option>

        </select>


        <select id="difficulty">

            <option value="easy">
                Kolay
            </option>

            <option
                value="normal"
                selected
            >
                Normal
            </option>

            <option value="hard">
                Zor
            </option>

        </select>


        <button
            class="menuButton backButton"
            id="enemyBack"
        >
            GERİ
        </button>

    </div>

</div>


<!-- =========================================
     ODA MENÜSÜ
========================================= -->

<div
    id="roomMenu"
    class="menu"
    style="display:none"
>

    <div class="menuBox">

        <h2>
            MULTIPLAYER
        </h2>


        <button
            class="menuButton"
            id="createRoomBtn"
        >
            ODA OLUŞTUR
        </button>


        <p style="margin:20px">
            VEYA
        </p>


        <input
            id="roomCodeInput"
            maxlength="6"
            placeholder="ODA KODU"
        >


        <button
            class="menuButton"
            id="joinRoomBtn"
        >
            ODAYA KATIL
        </button>


        <div id="roomMessage"></div>


        <button
            class="menuButton backButton"
            id="roomBack"
        >
            GERİ
        </button>

    </div>

</div>


<!-- =========================================
     OYUN
========================================= -->

<canvas id="game"></canvas>


<!-- =========================================
     HUD
========================================= -->

<div id="hud">

    <div id="fps">
        FPS: 0
    </div>


    <div id="roomInfo">
        Oda: -
    </div>


    <div id="score">
        Skor: 0
    </div>


    <div id="crosshair"></div>


    <div id="stats">

        CAN:

        <span id="healthText">
            100
        </span>


        <div id="health-bar">

            <div id="health-fill"></div>

        </div>

    </div>


    <div id="ammo">

        <span id="ammoValue">
            30
        </span>

        / 120

    </div>


    <div id="weapon">

        <div
            class="weapon-barrel"
        ></div>

        <div
            class="weapon-main"
        ></div>

        <div
            class="weapon-mag"
        ></div>

        <div
            class="weapon-handle"
        ></div>

    </div>


    <div id="muzzle"></div>

</div>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js">
</script>


<script>


/* =========================================
   OYUN AYARLARI
========================================= */

let selectedMap =
    "training";


let botsEnabled =
    false;


let botCount =
    1;


let difficulty =
    "normal";


let currentRoom =
    "";


/* =========================================
   OYUN DEĞİŞKENLERİ
========================================= */

let scene;

let camera;

let renderer;

let clock;

let player;

let bots = [];

let health =
    100;

let score =
    0;

let ammo =
    30;

let reserveAmmo =
    120;

let yaw =
    0;

let pitch =
    0;

let canShoot =
    true;

let reloading =
    false;

let gameStarted =
    false;

let keys = {};

let fpsFrames =
    0;

let fpsTime =
    0;


/* =========================================
   MENÜLER
========================================= */

const mainMenu =
    document.getElementById(
        "mainMenu"
    );

const mapMenu =
    document.getElementById(
        "mapMenu"
    );

const enemyMenu =
    document.getElementById(
        "enemyMenu"
    );

const roomMenu =
    document.getElementById(
        "roomMenu"
    );

const hud =
    document.getElementById(
        "hud"
    );


/* =========================================
   ANA MENÜ
========================================= */

document
    .getElementById(
        "playButton"
    )
    .onclick = function() {

        mainMenu.style.display =
            "none";

        roomMenu.style.display =
            "flex";

    };


document
    .getElementById(
        "mapButton"
    )
    .onclick = function() {

        mainMenu.style.display =
            "none";

        mapMenu.style.display =
            "flex";

    };


document
    .getElementById(
        "enemyButton"
    )
    .onclick = function() {

        mainMenu.style.display =
            "none";

        enemyMenu.style.display =
            "flex";

    };


/* =========================================
   HARİTA SEÇİMİ
========================================= */

document
    .querySelectorAll(
        ".mapCard"
    )
    .forEach(

        function(card) {

            card.onclick = function() {

                document
                    .querySelectorAll(
                        ".mapCard"
                    )
                    .forEach(

                        c =>

                            c.classList
                                .remove(
                                    "active"
                                )

                    );


                card.classList
                    .add(
                        "active"
                    );


                selectedMap =

                    card.dataset.map;

            };

        }

    );


document
    .getElementById(
        "mapBack"
    )
    .onclick = function() {

        mapMenu.style.display =
            "none";

        mainMenu.style.display =
            "flex";

    };


/* =========================================
   DÜŞMAN AYARLARI
========================================= */

const botsOff =
    document.getElementById(
        "botsOff"
    );

const botsOn =
    document.getElementById(
        "botsOn"
    );


botsOff.onclick = function() {

    botsEnabled =
        false;

    botsOff.classList
        .add(
            "active"
        );

    botsOn.classList
        .remove(
            "active"
        );

};


botsOn.onclick = function() {

    botsEnabled =
        true;

    botsOn.classList
        .add(
            "active"
        );

    botsOff.classList
        .remove(
            "active"
        );

};


document
    .getElementById(
        "botCount"
    )
    .onchange = function(e) {

        botCount =

            Number(
                e.target.value
            );

    };


document
    .getElementById(
        "difficulty"
    )
    .onchange = function(e) {

        difficulty =

            e.target.value;

    };


document
    .getElementById(
        "enemyBack"
    )
    .onclick = function() {

        enemyMenu.style.display =
            "none";

        mainMenu.style.display =
            "flex";

    };


/* =========================================
   ODA SİSTEMİ
========================================= */

function generateRoomCode() {

    const chars =

        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


    let code =
        "";


    for (

        let i = 0;

        i < 6;

        i++

    ) {

        code +=

            chars[

                Math.floor(

                    Math.random() *

                    chars.length

                )

            ];

    }


    return code;

}


document
    .getElementById(
        "createRoomBtn"
    )
    .onclick = function() {

        currentRoom =

            generateRoomCode();


        document
            .getElementById(
                "roomMessage"
            )
            .textContent =

                "Oda oluşturuldu: " +

                currentRoom;


        setTimeout(

            startGame,

            1000

        );

    };


document
    .getElementById(
        "joinRoomBtn"
    )
    .onclick = function() {

        const code =

            document
                .getElementById(
                    "roomCodeInput"
                )
                .value

                .trim()

                .toUpperCase();


        if (

            code.length !== 6

        ) {

            document
                .getElementById(
                    "roomMessage"
                )
                .textContent =

                    "6 haneli kod gir.";

            return;

        }


        currentRoom =
            code;


        document
            .getElementById(
                "roomMessage"
            )
            .textContent =

                "Odaya katıldın: " +

                code;


        setTimeout(

            startGame,

            1000

        );

    };


document
    .getElementById(
        "roomBack"
    )
    .onclick = function() {

        roomMenu.style.display =
            "none";

        mainMenu.style.display =
            "flex";

    };


/* =========================================
   OYUN BAŞLAT
========================================= */

function startGame() {

    roomMenu.style.display =
        "none";

    hud.style.display =
        "block";

    gameStarted =
        true;

    init();

    document
        .getElementById(
            "roomInfo"
        )
        .textContent =

            "Oda: " +

            currentRoom;

}


/* =========================================
   THREE.JS
========================================= */

function init() {

    scene =
        new THREE.Scene();


    scene.background =

        new THREE.Color(

            selectedMap === "desert"

                ? 0xc9a66b

                : selectedMap === "forest"

                ? 0x557755

                : selectedMap === "city"

                ? 0x70757a

                : 0x87a9c7

        );


    scene.fog =

        new THREE.Fog(

            scene.background,

            30,

            130

        );


    camera =

        new THREE.PerspectiveCamera(

            75,

            window.innerWidth /

            window.innerHeight,

            .1,

            300

        );


    renderer =

        new THREE.WebGLRenderer({

            canvas:

                document.getElementById(
                    "game"
                ),

            antialias:
                true,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(

        Math.min(

            window.devicePixelRatio,

            1.5

        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    clock =
        new THREE.Clock();


    const light =

        new THREE.HemisphereLight(

            0xffffff,

            0x444444,

            1.3

        );


    scene.add(
        light
    );


    player = {

        position:

            new THREE.Vector3(

                0,

                1.6,

                25

            ),

        speed:
            7

    };


    camera.position.copy(

        player.position

    );


    createMap();


    if (
        botsEnabled
    ) {

        for (

            let i = 0;

            i < botCount;

            i++

        ) {

            createBot();

        }

    }


    setupControls();


    animate();

}


/* =========================================
   HARİTA
========================================= */

function createMap() {

    let floorColor =
        0x555b60;


    if (
        selectedMap ===
        "desert"
    ) {

        floorColor =
            0xc9a66b;

    }


    if (
        selectedMap ===
        "forest"
    ) {

        floorColor =
            0x416b45;

    }


    if (
        selectedMap ===
        "city"
    ) {

        floorColor =
            0x666a70;

    }


    const floor =

        new THREE.Mesh(

            new THREE.PlaneGeometry(

                100,

                100

            ),

            new THREE.MeshStandardMaterial({

                color:
                    floorColor

            })

        );


    floor.rotation.x =

        -Math.PI / 2;


    scene.add(
        floor
    );


    createWall(

        0,

        2,

        -45,

        90,

        4,

        2

    );


    createWall(

        0,

        2,

        45,

        90,

        4,

        2

    );


    createWall(

        -45,

        2,

        0,

        2,

        4,

        90

    );


    createWall(

        45,

        2,

        0,

        2,

        4,

        90

    );


    if (

        selectedMap ===

        "city"

    ) {

        for (

            let i = 0;

            i < 12;

            i++

        ) {

            createWall(

                Math.random() *

                60 -

                30,

                2,

                Math.random() *

                60 -

                30,

                5,

                4,

                5

            );

        }

    }


    if (

        selectedMap ===

        "forest"

    ) {

        for (

            let i = 0;

            i < 20;

            i++

        ) {

            createTree(

                Math.random() *

                70 -

                35,

                Math.random() *

                70 -

                35

            );

        }

    }


    if (

        selectedMap ===

        "desert"

    ) {

        for (

            let i = 0;

            i < 12;

            i++

        ) {

            createWall(

                Math.random() *

                70 -

                35,

                1,

                Math.random() *

                70 -

                35,

                4,

                2,

                4

            );

        }

    }

}


/* =========================================
   DUVAR
========================================= */

function createWall(

    x,

    y,

    z,

    width,

    height,

    depth

) {

    const wall =

        new THREE.Mesh(

            new THREE.BoxGeometry(

                width,

                height,

                depth

            ),

            new THREE.MeshStandardMaterial({

                color:
                    0x777b80

            })

        );


    wall.position.set(

        x,

        y,

        z

    );


    scene.add(
        wall
    );

}


/* =========================================
   AĞAÇ
========================================= */

function createTree(

    x,

    z

) {

    const trunk =

        new THREE.Mesh(

            new THREE.CylinderGeometry(

                .3,

                .4,

                3

            ),

            new THREE.MeshStandardMaterial({

                color:
                    0x654321

            })

        );


    trunk.position.set(

        x,

        1.5,

        z

    );


    scene.add(
        trunk
    );


    const leaves =

        new THREE.Mesh(

            new THREE.SphereGeometry(

                2,

                8,

                8

            ),

            new THREE.MeshStandardMaterial({

                color:
                    0x236b35

            })

        );


    leaves.position.set(

        x,

        4,

        z

    );


    scene.add(
        leaves
    );

}


/* =========================================
   BOT
========================================= */

function createBot() {

    const bot =

        new THREE.Group();


    const body =

        new THREE.Mesh(

            new THREE.BoxGeometry(

                .8,

                1.2,

                .5

            ),

            new THREE.MeshStandardMaterial({

                color:
                    0x8b2020

            })

        );


    body.position.y =
        .8;


    bot.add(
        body
    );


    const head =

        new THREE.Mesh(

            new THREE.SphereGeometry(

                .3,

                12,

                12

            ),

            new THREE.MeshStandardMaterial({

                color:
                    0xffc49b

            })

        );


    head.position.y =
        1.65;


    bot.add(
        head
    );


    bot.position.set(

        Math.random() *

        60 -

        30,

        0,

        Math.random() *

        60 -

        20

    );


    let speed =
        1.5;


    if (
        difficulty ===
        "easy"
    ) {

        speed =
            1;

    }


    if (
        difficulty ===
        "hard"
    ) {

        speed =
            3;

    }


    bot.userData = {

        health:
            100,

        speed:
            speed

    };


    scene.add(
        bot
    );


    bots.push(
        bot
    );

}


/* =========================================
   KONTROLLER
========================================= */

function setupControls() {

    document.addEventListener(

        "keydown",

        function(e) {

            keys[
                e.code
            ] = true;


            if (

                e.code ===
                "KeyR"

            ) {

                reload();

            }

        }

    );


    document.addEventListener(

        "keyup",

        function(e) {

            keys[
                e.code
            ] = false;

        }

    );


    document.addEventListener(

        "mousemove",

        function(e) {

            if (

                document.pointerLockElement

                !==

                document.getElementById(
                    "game"
                )

            )
                return;


            yaw -=

                e.movementX *

                .002;


            pitch -=

                e.movementY *

                .002;


            pitch =

                Math.max(

                    -1.4,

                    Math.min(

                        1.4,

                        pitch

                    )

                );

        }

    );


    document.addEventListener(

        "mousedown",

        function(e) {

            if (

                e.button === 0 &&

                gameStarted

            ) {

                shoot();

            }

        }

    );


    document
        .getElementById(
            "game"
        )
        .addEventListener(

            "click",

            function() {

                this.requestPointerLock();

            }

        );

}


/* =========================================
   OYUNCU HAREKETİ
========================================= */

function updatePlayer(

    delta

) {

    const direction =

        new THREE.Vector3();


    /* W = İLERİ */

    if (
        keys["KeyW"]
    )
        direction.z -= 1;


    /* S = GERİ */

    if (
        keys["KeyS"]
    )
        direction.z += 1;


    /* A = SOL */

    if (
        keys["KeyA"]
    )
        direction.x -= 1;


    /* D = SAĞ */

    if (
        keys["KeyD"]
    )
        direction.x += 1;


    if (

        direction.lengthSq() >

        0

    ) {

        direction.normalize();

    }


    const forward =

        new THREE.Vector3(

            Math.sin(yaw),

            0,

            Math.cos(yaw)

        );


    const right =

        new THREE.Vector3(

            Math.cos(yaw),

            0,

            -Math.sin(yaw)

        );


    /* İLERİ GERİ */

    player.position.add(

        forward.multiplyScalar(

            -direction.z *

            player.speed *

            delta

        )

    );


    /* SAĞ SOL */

    player.position.add(

        right.multiplyScalar(

            direction.x *

            player.speed *

            delta

        )

    );


    player.position.x =

        Math.max(

            -42,

            Math.min(

                42,

                player.position.x

            )

        );


    player.position.z =

        Math.max(

            -42,

            Math.min(

                42,

                player.position.z

            )

        );


    camera.position.copy(

        player.position

    );


    camera.rotation.order =

        "YXZ";


    camera.rotation.y =

        yaw;


    camera.rotation.x =

        pitch;

}


/* =========================================
   ATEŞ
========================================= */

function shoot() {

    if (

        !canShoot ||

        reloading ||

        ammo <= 0

    )
        return;


    ammo--;


    canShoot =
        false;


    updateHUD();


    setTimeout(

        function() {

            canShoot =
                true;

        },

        120

    );


    const muzzle =

        document.getElementById(
            "muzzle"
        );


    muzzle.style.display =
        "block";


    setTimeout(

        function() {

            muzzle.style.display =
                "none";

        },

        60

    );


    const raycaster =

        new THREE.Raycaster();


    raycaster.setFromCamera(

        new THREE.Vector2(

            0,

            0

        ),

        camera

    );


    const objects = [];


    bots.forEach(

        bot => {

            bot.traverse(

                child => {

                    if (

                        child.isMesh

                    )
                        objects.push(
                            child
                        );

                }

            );

        }

    );


    const hits =

        raycaster.intersectObjects(

            objects

        );


    if (

        hits.length > 0

    ) {

        let bot =

            hits[0].object;


        while (

            bot.parent &&

            !bot.userData.health

        ) {

            bot =
                bot.parent;

        }


        if (

            bot.userData &&

            bot.userData.health

        ) {

            bot.userData.health -=

                50;


            if (

                bot.userData.health <=
                0

            ) {

                scene.remove(
                    bot
                );


                bots =

                    bots.filter(

                        b =>
                            b !== bot

                    );


                score +=
                    100;


                updateHUD();

            }

        }

    }

}


/* =========================================
   BOT HAREKETİ
========================================= */

function updateBots(

    delta

) {

    if (
        !botsEnabled
    )
        return;


    bots.forEach(

        bot => {

            const direction =

                new THREE.Vector3()

                .subVectors(

                    player.position,

                    bot.position

                )

                .normalize();


            bot.position.add(

                direction.multiplyScalar(

                    bot.userData.speed *

                    delta

                )

            );


            bot.lookAt(

                player.position.x,

                1,

                player.position.z

            );


            if (

                bot.position.distanceTo(

                    player.position

                ) < 3

            ) {

                damagePlayer(

                    difficulty ===
                    "hard"

                        ? 15

                        : 5

                );

            }

        }

    );

}


/* =========================================
   HASAR
========================================= */

function damagePlayer(

    amount

) {

    health -=

        amount;


    health =

        Math.max(

            0,

            health

        );


    updateHUD();


    if (

        health <=
        0

    ) {

        health =
            100;


        player.position.set(

            0,

            1.6,

            25

        );


        updateHUD();

    }

}


/* =========================================
   RELOAD
========================================= */

function reload() {

    if (

        reloading ||

        ammo >= 30 ||

        reserveAmmo <= 0

    )
        return;


    reloading =
        true;


    setTimeout(

        function() {

            const amount =

                Math.min(

                    30 - ammo,

                    reserveAmmo

                );


            ammo +=
                amount;


            reserveAmmo -=
                amount;


            reloading =
                false;


            updateHUD();

        },

        1200

    );

}


/* =========================================
   HUD
========================================= */

function updateHUD() {

    document
        .getElementById(
            "healthText"
        )
        .textContent =

            health;


    document
        .getElementById(
            "health-fill"
        )
        .style.width =

            health +

            "%";


    document
        .getElementById(
            "ammoValue"
        )
        .textContent =

            ammo;


    document
        .getElementById(
            "score"
        )
        .textContent =

            "Skor: " +

            score;

}


/* =========================================
   FPS
========================================= */

function updateFPS(

    delta

) {

    fpsFrames++;

    fpsTime +=

        delta;


    if (

        fpsTime >= .5

    ) {

        const fps =

            Math.round(

                fpsFrames /

                fpsTime

            );


        document
            .getElementById(
                "fps"
            )
            .textContent =

                "FPS: " +

                fps;


        fpsFrames =
            0;


        fpsTime =
            0;

    }

}


/* =========================================
   OYUN DÖNGÜSÜ
========================================= */

function animate() {

    requestAnimationFrame(

        animate

    );


    if (
        !gameStarted
    )
        return;


    const delta =

        Math.min(

            clock.getDelta(),

            .05

        );


    updatePlayer(

        delta

    );


    updateBots(

        delta

    );


    updateFPS(

        delta

    );


    renderer.render(

        scene,

        camera

    );

}


/* =========================================
   EKRAN BOYUTU
========================================= */

window.addEventListener(

    "resize",

    function() {

        if (

            !camera ||

            !renderer

        )
            return;


        camera.aspect =

            window.innerWidth /

            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

    }

);

</script>
