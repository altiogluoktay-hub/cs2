<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    WebStrike FPS Multiplayer
</title>

<style>

/* =================================
   GENEL
================================= */

* {

    box-sizing:
        border-box;

    margin:
        0;

    padding:
        0;

}

html,
body {

    width:
        100%;

    height:
        100%;

    overflow:
        hidden;

    background:
        #080b0f;

    font-family:
        Arial,
        sans-serif;

}

#game {

    position:
        fixed;

    inset:
        0;

    width:
        100%;

    height:
        100%;

}


/* =================================
   ODA MENÜSÜ
================================= */

#roomMenu {

    position:
        fixed;

    inset:
        0;

    z-index:
        9999;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    background:

        radial-gradient(

            circle,

            #263e59,

            #05070a 75%

        );

}

.roomBox {

    width:
        430px;

    max-width:
        90%;

    padding:
        40px;

    text-align:
        center;

    color:
        white;

    background:
        rgba(
            10,
            15,
            22,
            .96
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .15
        );

    border-radius:
        18px;

    box-shadow:

        0 20px 80px

        rgba(
            0,
            0,
            0,
            .8
        );

}

.roomBox h1 {

    font-size:
        40px;

    letter-spacing:
        5px;

    margin-bottom:
        5px;

}

.subtitle {

    color:
        #8995a3;

    margin-bottom:
        30px;

}

.roomBox input {

    width:
        100%;

    padding:
        15px;

    margin-top:
        10px;

    border:
        1px solid
        #444;

    border-radius:
        8px;

    background:
        #151a21;

    color:
        white;

    text-align:
        center;

    font-size:
        18px;

    text-transform:
        uppercase;

    outline:
        none;

}

.roomBox button {

    width:
        100%;

    padding:
        15px;

    margin-top:
        10px;

    border:
        none;

    border-radius:
        8px;

    background:
        #e63946;

    color:
        white;

    font-size:
        17px;

    font-weight:
        bold;

    cursor:
        pointer;

}

.roomBox button:hover {

    background:
        #ff5662;

}

.divider {

    margin:
        25px 0;

    color:
        #687382;

}

#roomMessage {

    margin-top:
        20px;

    min-height:
        25px;

    color:
        #54e68b;

}


/* =================================
   HUD
================================= */

#hud {

    display:
        none;

    position:
        fixed;

    inset:
        0;

    z-index:
        10;

    pointer-events:
        none;

    color:
        white;

}

#fps {

    position:
        absolute;

    top:
        15px;

    left:
        15px;

    padding:
        8px 12px;

    background:
        rgba(
            0,
            0,
            0,
            .55
        );

    border-radius:
        6px;

}

#roomInfo {

    position:
        absolute;

    top:
        55px;

    left:
        15px;

    padding:
        7px 12px;

    background:
        rgba(
            0,
            0,
            0,
            .55
        );

    border-radius:
        6px;

    font-size:
        13px;

}

#score {

    position:
        absolute;

    top:
        20px;

    right:
        20px;

    padding:
        10px 15px;

    background:
        rgba(
            0,
            0,
            0,
            .55
        );

    border-radius:
        7px;

}

#crosshair {

    position:
        absolute;

    left:
        50%;

    top:
        50%;

    width:
        22px;

    height:
        22px;

    transform:
        translate(
            -50%,
            -50%
        );

}

#crosshair::before {

    content:
        "";

    position:
        absolute;

    left:
        10px;

    width:
        2px;

    height:
        22px;

    background:
        white;

}

#crosshair::after {

    content:
        "";

    position:
        absolute;

    top:
        10px;

    width:
        22px;

    height:
        2px;

    background:
        white;

}

#stats {

    position:
        absolute;

    left:
        20px;

    bottom:
        20px;

    width:
        220px;

    padding:
        15px;

    background:
        rgba(
            0,
            0,
            0,
            .65
        );

    border-radius:
        10px;

}

#health-bar {

    width:
        100%;

    height:
        12px;

    margin-top:
        8px;

    background:
        #333;

    border-radius:
        8px;

    overflow:
        hidden;

}

#health-fill {

    width:
        100%;

    height:
        100%;

    background:
        #28d66c;

}

#ammo {

    position:
        absolute;

    right:
        25px;

    bottom:
        25px;

    font-size:
        28px;

    font-weight:
        bold;

}

#damage {

    display:
        none;

    position:
        fixed;

    inset:
        0;

    z-index:
        9;

    background:
        rgba(
            255,
            0,
            0,
            .25
        );

    pointer-events:
        none;

}


/* =================================
   SİLAH
================================= */

#weapon {

    position:
        absolute;

    right:
        7%;

    bottom:
        0;

    width:
        330px;

    height:
        170px;

    transform:
        rotate(
            -5deg
        );

}

.weapon-main {

    position:
        absolute;

    right:
        20px;

    bottom:
        50px;

    width:
        240px;

    height:
        50px;

    background:
        #1b1b1b;

    border-radius:
        8px;

}

.weapon-barrel {

    position:
        absolute;

    right:
        250px;

    bottom:
        67px;

    width:
        100px;

    height:
        15px;

    background:
        #090909;

}

.weapon-handle {

    position:
        absolute;

    right:
        80px;

    bottom:
        -5px;

    width:
        55px;

    height:
        85px;

    background:
        #222;

    transform:
        rotate(
            12deg
        );

}

.weapon-mag {

    position:
        absolute;

    right:
        160px;

    bottom:
        5px;

    width:
        35px;

    height:
        75px;

    background:
        #111;

    transform:
        rotate(
            12deg
        );

}

#muzzle {

    display:
        none;

    position:
        absolute;

    right:
        calc(
            7% + 345px
        );

    bottom:
        75px;

    width:
        35px;

    height:
        35px;

    background:
        #ffb000;

    border-radius:
        50%;

    box-shadow:

        0 0 15px
        #ff6600,

        0 0 40px
        #ff9900;

}

</style>

</head>


<body>


<!-- =================================
     ODA MENÜSÜ
================================= -->

<div id="roomMenu">

    <div class="roomBox">

        <h1>
            WEBSTRIKE
        </h1>

        <div class="subtitle">
            Multiplayer FPS
        </div>

        <button
            id="createRoomBtn"
        >
            ODA OLUŞTUR
        </button>

        <div class="divider">
            VEYA
        </div>

        <input
            id="roomCodeInput"
            maxlength="6"
            placeholder="ODA KODU"
        >

        <button
            id="joinRoomBtn"
        >
            ODAYA KATIL
        </button>

        <div id="roomMessage"></div>

    </div>

</div>


<!-- =================================
     OYUN
================================= -->

<canvas
    id="game"
></canvas>


<!-- =================================
     HUD
================================= -->

<div id="hud">

    <div id="fps">
        FPS: 0
    </div>

    <div id="roomInfo">
        Oda: -
    </div>

    <div id="score">
        Skor: 0
    </div>

    <div id="crosshair"></div>

    <div id="stats">

        CAN:

        <span id="healthText">
            100
        </span>

        <div id="health-bar">

            <div
                id="health-fill"
            ></div>

        </div>

    </div>

    <div id="ammo">

        <span id="ammoValue">
            30
        </span>

        / 120

    </div>

    <div id="weapon">

        <div
            class="weapon-barrel"
        ></div>

        <div
            class="weapon-main"
        ></div>

        <div
            class="weapon-mag"
        ></div>

        <div
            class="weapon-handle"
        ></div>

    </div>

    <div id="muzzle"></div>

</div>


<div id="damage"></div>


<!-- =================================
     THREE.JS
================================= -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js">
</script>


<script>


/* =================================
   DEĞİŞKENLER
================================= */

let scene;

let camera;

let renderer;

let clock;

let player;

let bots = [];

let health = 100;

let score = 0;

let ammo = 30;

let reserveAmmo = 120;

let canShoot = true;

let reloading = false;

let gameStarted = false;

let yaw = 0;

let pitch = 0;

let fpsFrames = 0;

let fpsTime = 0;

let keys = {};

let currentRoom = "";


/* =================================
   HTML
================================= */

const roomMenu =
    document.getElementById(
        "roomMenu"
    );

const createRoomBtn =
    document.getElementById(
        "createRoomBtn"
    );

const joinRoomBtn =
    document.getElementById(
        "joinRoomBtn"
    );

const roomCodeInput =
    document.getElementById(
        "roomCodeInput"
    );

const roomMessage =
    document.getElementById(
        "roomMessage"
    );

const roomInfo =
    document.getElementById(
        "roomInfo"
    );

const hud =
    document.getElementById(
        "hud"
    );


/* =================================
   ODA KODU
================================= */

function generateRoomCode() {

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";

    for (
        let i = 0;
        i < 6;
        i++
    ) {

        code +=

            chars[
                Math.floor(

                    Math.random() *

                    chars.length

                )
            ];

    }

    return code;

}


/* =================================
   ODA OLUŞTUR
================================= */

createRoomBtn.onclick =
function() {

    currentRoom =
        generateRoomCode();


    roomMessage.textContent =

        "Oda oluşturuldu: " +

        currentRoom;


    roomInfo.textContent =

        "Oda: " +

        currentRoom;


    setTimeout(

        startGame,

        1200

    );

};


/* =================================
   ODAYA KATIL
================================= */

joinRoomBtn.onclick =
function() {

    const code =

        roomCodeInput.value

        .trim()

        .toUpperCase();


    if (
        code.length !== 6
    ) {

        roomMessage.textContent =

            "6 haneli oda kodu gir.";

        return;

    }


    currentRoom =
        code;


    roomMessage.textContent =

        "Odaya katılıyorsun: " +

        currentRoom;


    roomInfo.textContent =

        "Oda: " +

        currentRoom;


    setTimeout(

        startGame,

        1000

    );

};


/* =================================
   OYUNU BAŞLAT
================================= */

function startGame() {

    roomMenu.style.display =
        "none";

    hud.style.display =
        "block";

    gameStarted =
        true;

    init();

    document.body.requestPointerLock();

}


/* =================================
   THREE.JS BAŞLAT
================================= */

function init() {

    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x87a9c7
        );


    scene.fog =
        new THREE.Fog(
            0x87a9c7,
            30,
            120
        );


    camera =
        new THREE.PerspectiveCamera(

            75,

            window.innerWidth /

            window.innerHeight,

            .1,

            300

        );


    renderer =
        new THREE.WebGLRenderer({

            canvas:
                document.getElementById(
                    "game"
                ),

            antialias:
                true,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(

        Math.min(

            window.devicePixelRatio,

            1.5

        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    clock =
        new THREE.Clock();


    /* IŞIK */

    const ambient =

        new THREE.HemisphereLight(

            0xffffff,

            0x444444,

            1.2

        );


    scene.add(
        ambient
    );


    const sun =

        new THREE.DirectionalLight(

            0xffffff,

            1.5

        );


    sun.position.set(

        30,

        50,

        20

    );


    scene.add(
        sun
    );


    /* OYUNCU */

    player = {

        position:

            new THREE.Vector3(

                0,

                1.6,

                25

            ),

        speed:
            7

    };


    camera.position.copy(

        player.position

    );


    createMap();

    createBots();

    setupControls();

    animate();

}


/* =================================
   HARİTA
================================= */

function createMap() {

    const floor =

        new THREE.Mesh(

            new THREE.PlaneGeometry(

                100,

                100

            ),

            new THREE.MeshStandardMaterial({

                color:
                    0x555b60

            })

        );


    floor.rotation.x =

        -Math.PI / 2;


    scene.add(
        floor
    );


    /* MAVİ BÖLGE */

    createZone(

        -25,

        0,

        20,

        25,

        0x286090

    );


    /* KIRMIZI BÖLGE */

    createZone(

        25,

        0,

        20,

        25,

        0x904040

    );


    /* YEŞİL BÖLGE */

    createZone(

        0,

        -25,

        35,

        20,

        0x3d8050

    );


    /* DIŞ DUVARLAR */

    createWall(

        0,

        2,

        -45,

        90,

        4,

        2

    );


    createWall(

        0,

        2,

        45,

        90,

        4,

        2

    );


    createWall(

        -45,

        2,

        0,

        2,

        4,

        90

    );


    createWall(

        45,

        2,

        0,

        2,

        4,

        90

    );


    /* İÇ DUVAR */

    createWall(

        0,

        2,

        10,

        2,

        4,

        25

    );

}


/* =================================
   BÖLGE
================================= */

function createZone(

    x,

    z,

    width,

    depth,

    color

) {

    const zone =

        new THREE.Mesh(

            new THREE.PlaneGeometry(

                width,

                depth

            ),

            new THREE.MeshBasicMaterial({

                color:

                    color,

                transparent:

                    true,

                opacity:

                    .25

            })

        );


    zone.rotation.x =

        -Math.PI / 2;


    zone.position.set(

        x,

        .01,

        z

    );


    scene.add(
        zone
    );

}


/* =================================
   DUVAR
================================= */

function createWall(

    x,

    y,

    z,

    width,

    height,

    depth

) {

    const wall =

        new THREE.Mesh(

            new THREE.BoxGeometry(

                width,

                height,

                depth

            ),

            new THREE.MeshStandardMaterial({

                color:

                    0x777b80

            })

        );


    wall.position.set(

        x,

        y,

        z

    );


    scene.add(
        wall
    );

}


/* =================================
   BOTLAR
================================= */

function createBots() {

    for (

        let i = 0;

        i < 8;

        i++

    ) {

        createBot();

    }

}


function createBot() {

    const bot =

        new THREE.Group();


    const body =

        new THREE.Mesh(

            new THREE.BoxGeometry(

                .8,

                1.2,

                .5

            ),

            new THREE.MeshStandardMaterial({

                color:

                    0x263d9c

            })

        );


    body.position.y =
        .8;


    bot.add(
        body
    );


    const head =

        new THREE.Mesh(

            new THREE.SphereGeometry(

                .3,

                12,

                12

            ),

            new THREE.MeshStandardMaterial({

                color:

                    0xffc49b

            })

        );


    head.position.y =
        1.65;


    bot.add(
        head
    );


    /* DÜŞMAN SİLAHI */

    const gun =

        new THREE.Mesh(

            new THREE.BoxGeometry(

                .15,

                .15,

                1

            ),

            new THREE.MeshStandardMaterial({

                color:

                    0x111111

            })

        );


    gun.position.set(

        .55,

        1,

        -.5

    );


    bot.add(
        gun
    );


    bot.position.set(

        Math.random() *

        65 -

        32,

        0,

        Math.random() *

        65 -

        25

    );


    bot.userData = {

        health:
            100,

        speed:
            1.5,

        shootTimer:
            1

    };


    scene.add(
        bot
    );


    bots.push(
        bot
    );

}


/* =================================
   KONTROLLER
================================= */

function setupControls() {


    document.addEventListener(

        "keydown",

        function(e) {

            keys[
                e.code
            ] = true;


            if (

                e.code ===

                "KeyR"

            ) {

                reload();

            }

        }

    );


    document.addEventListener(

        "keyup",

        function(e) {

            keys[
                e.code
            ] = false;

        }

    );


    document.addEventListener(

        "mousemove",

        function(e) {

            if (

                document.pointerLockElement

                !==

                document.getElementById(
                    "game"
                )

            ) {

                return;

            }


            yaw -=

                e.movementX *

                .002;


            pitch -=

                e.movementY *

                .002;


            pitch =

                Math.max(

                    -1.4,

                    Math.min(

                        1.4,

                        pitch

                    )

                );

        }

    );


    document.addEventListener(

        "mousedown",

        function(e) {

            if (

                e.button === 0 &&

                gameStarted

            ) {

                shoot();

            }

        }

    );

}


/* =================================
   OYUNCU
================================= */

function updatePlayer(
    delta
) {

    const direction =

        new THREE.Vector3();


    if (
        keys["KeyW"]
    )
        direction.z -= 1;


    if (
        keys["KeyS"]
    )
        direction.z += 1;


    if (
        keys["KeyA"]
    )
        direction.x -= 1;


    if (
        keys["KeyD"]
    )
        direction.x += 1;


    if (

        direction.lengthSq() >

        0

    ) {

        direction.normalize();

    }


    const forward =

        new THREE.Vector3(

            Math.sin(yaw),

            0,

            Math.cos(yaw)

        );


    const right =

        new THREE.Vector3(

            Math.cos(yaw),

            0,

            -Math.sin(yaw)

        );


    player.position.add(

        forward.multiplyScalar(

            -direction.z *

            player.speed *

            delta

        )

    );


    player.position.add(

        right.multiplyScalar(

            direction.x *

            player.speed *

            delta

        )

    );


    player.position.x =

        Math.max(

            -42,

            Math.min(

                42,

                player.position.x

            )

        );


    player.position.z =

        Math.max(

            -42,

            Math.min(

                42,

                player.position.z

            )

        );


    camera.position.copy(

        player.position

    );


    camera.rotation.order =

        "YXZ";


    camera.rotation.y =

        yaw;


    camera.rotation.x =

        pitch;

}


/* =================================
   ATEŞ
================================= */

function shoot() {

    if (

        !canShoot ||

        reloading

    )
        return;


    if (
        ammo <= 0
    ) {

        reload();

        return;

    }


    ammo--;


    updateHUD();


    canShoot =
        false;


    setTimeout(

        function() {

            canShoot =
                true;

        },

        120

    );


    const muzzle =

        document.getElementById(

            "muzzle"

        );


    muzzle.style.display =

        "block";


    setTimeout(

        function() {

            muzzle.style.display =

                "none";

        },

        60

    );


    const raycaster =

        new THREE.Raycaster();


    raycaster.setFromCamera(

        new THREE.Vector2(

            0,

            0

        ),

        camera

    );


    const objects = [];


    bots.forEach(

        function(bot) {

            bot.traverse(

                function(child) {

                    if (

                        child.isMesh

                    ) {

                        objects.push(

                            child

                        );

                    }

                }

            );

        }

    );


    const hits =

        raycaster.intersectObjects(

            objects

        );


    if (

        hits.length >

        0

    ) {

        let bot =

            hits[0].object;


        while (

            bot.parent &&

            !bot.userData.health

        ) {

            bot =

                bot.parent;

        }


        if (

            bot.userData &&

            bot.userData.health

        ) {

            bot.userData.health -=

                50;


            if (

                bot.userData.health <=

                0

            ) {

                killBot(
                    bot
                );

            }

        }

    }

}


/* =================================
   BOT AI
================================= */

function updateBots(
    delta
) {

    bots.forEach(

        function(bot) {

            const distance =

                bot.position.distanceTo(

                    player.position

                );


            if (

                distance >

                5

            ) {

                const direction =

                    new THREE.Vector3()

                    .subVectors(

                        player.position,

                        bot.position

                    )

                    .normalize();


                bot.position.add(

                    direction.multiplyScalar(

                        bot.userData.speed *

                        delta

                    )

                );

            }


            bot.lookAt(

                player.position.x,

                1,

                player.position.z

            );


            bot.userData.shootTimer -=

                delta;


            if (

                distance <

                25 &&

                bot.userData.shootTimer <=

                0

            ) {

                if (

                    Math.random() <

                    .4

                ) {

                    damagePlayer(

                        10

                    );

                }


                bot.userData.shootTimer =

                    1 +

                    Math.random() *

                    2;

            }

        }

    );

}


/* =================================
   BOT ÖLDÜR
================================= */

function killBot(
    bot
) {

    scene.remove(
        bot
    );


    bots =

        bots.filter(

            b =>

                b !== bot

        );


    score +=

        100;


    updateHUD();


    setTimeout(

        function() {

            if (

                gameStarted

            ) {

                createBot();

            }

        },

        2000

    );

}


/* =================================
   HASAR
================================= */

function damagePlayer(
    amount
) {

    health -=

        amount;


    health =

        Math.max(

            0,

            health

        );


    document.getElementById(

        "damage"

    ).style.display =

        "block";


    setTimeout(

        function() {

            document.getElementById(

                "damage"

            ).style.display =

                "none";

        },

        120

    );


    updateHUD();


    if (

        health <=

        0

    ) {

        health =

            100;


        player.position.set(

            0,

            1.6,

            25

        );

    }

}


/* =================================
   RELOAD
================================= */

function reload() {

    if (

        reloading ||

        ammo >= 30 ||

        reserveAmmo <= 0

    )
        return;


    reloading =
        true;


    setTimeout(

        function() {

            const need =

                30 -

                ammo;


            const amount =

                Math.min(

                    need,

                    reserveAmmo

                );


            ammo +=

                amount;


            reserveAmmo -=

                amount;


            reloading =
                false;


            updateHUD();

        },

        1200

    );

}


/* =================================
   HUD
================================= */

function updateHUD() {

    document.getElementById(

        "healthText"

    ).textContent =

        health;


    document.getElementById(

        "health-fill"

    ).style.width =

        health +

        "%";


    document.getElementById(

        "ammoValue"

    ).textContent =

        ammo;


    document.getElementById(

        "score"

    ).textContent =

        "Skor: " +

        score;

}


/* =================================
   FPS
================================= */

function updateFPS(
    delta
) {

    fpsFrames++;

    fpsTime +=

        delta;


    if (

        fpsTime >=

        .5

    ) {

        const fps =

            Math.round(

                fpsFrames /

                fpsTime

            );


        document.getElementById(

            "fps"

        ).textContent =

            "FPS: " +

            fps;


        fpsFrames =
            0;


        fpsTime =
            0;

    }

}


/* =================================
   ANİMASYON
================================= */

function animate() {

    requestAnimationFrame(

        animate

    );


    if (

        !gameStarted

    )
        return;


    const delta =

        Math.min(

            clock.getDelta(),

            .05

        );


    updatePlayer(

        delta

    );


    updateBots(

        delta

    );


    updateFPS(

        delta

    );


    renderer.render(

        scene,

        camera

    );

}


/* =================================
   EKRAN
================================= */

window.addEventListener(

    "resize",

    function() {

        if (

            !camera ||

            !renderer

        )
            return;


        camera.aspect =

            window.innerWidth /

            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

    }

);

</script>
