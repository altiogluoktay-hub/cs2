<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WebStrike FPS V2</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

#game {
    width: 100%;
    height: 100%;
    display: block;
}

#menu {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(
            circle at center,
            rgba(40,60,90,.5),
            rgba(0,0,0,.96)
        );
}

.menu-box {
    width: 430px;
    max-width: 90%;
    padding: 35px;
    text-align: center;
    color: white;
    background: rgba(15,18,25,.96);
    border: 1px solid #444;
    border-radius: 15px;
    box-shadow: 0 20px 80px rgba(0,0,0,.8);
}

.menu-box h1 {
    font-size: 42px;
    letter-spacing: 4px;
    margin-bottom: 8px;
}

.menu-box p {
    color: #aaa;
    line-height: 1.7;
    margin-bottom: 20px;
}

.menu-box button {
    width: 100%;
    padding: 15px;
    margin-top: 8px;
    border: 0;
    border-radius: 8px;
    background: #e63946;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.menu-box button:hover {
    background: #ff4d5a;
}

#quality {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    background: #222;
    color: white;
    border: 1px solid #555;
    border-radius: 7px;
}

#hud {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    color: white;
}

#crosshair {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 22px;
    height: 22px;
    transform: translate(-50%, -50%);
}

#crosshair span,
#crosshair::before,
#crosshair::after {
    position: absolute;
    content: "";
    display: block;
    background: white;
}

#crosshair::before {
    width: 2px;
    height: 22px;
    left: 10px;
    top: 0;
}

#crosshair::after {
    width: 22px;
    height: 2px;
    left: 0;
    top: 10px;
}

#fps {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 7px 10px;
    background: rgba(0,0,0,.55);
    border-radius: 6px;
    font-size: 14px;
}

#score {
    position: absolute;
    right: 20px;
    top: 20px;
    padding: 10px 15px;
    background: rgba(0,0,0,.55);
    border-radius: 7px;
    font-size: 18px;
}

#stats {
    position: absolute;
    left: 20px;
    bottom: 20px;
    width: 220px;
    padding: 15px;
    background: rgba(0,0,0,.65);
    border-radius: 10px;
}

#health-bar {
    width: 100%;
    height: 12px;
    margin-top: 8px;
    background: #333;
    border-radius: 8px;
    overflow: hidden;
}

#health-fill {
    width: 100%;
    height: 100%;
    background: #29d66d;
    transition: width .15s;
}

#ammo {
    position: absolute;
    right: 25px;
    bottom: 25px;
    font-size: 28px;
    font-weight: bold;
    text-shadow: 0 2px 5px black;
}

#message {
    position: absolute;
    left: 50%;
    top: 18%;
    transform: translateX(-50%);
    font-size: 26px;
    font-weight: bold;
    text-shadow: 0 3px 10px black;
}

#help {
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    padding: 7px 12px;
    background: rgba(0,0,0,.45);
    border-radius: 6px;
    font-size: 13px;
}

#damage {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9;
    pointer-events: none;
    background: rgba(255,0,0,.25);
}

#weapon {
    position: absolute;
    right: 7%;
    bottom: -5px;
    width: 330px;
    height: 170px;
    transform: rotate(-5deg);
}

.weapon-main {
    position: absolute;
    right: 20px;
    bottom: 50px;
    width: 240px;
    height: 50px;
    background: #1c1c1c;
    border-radius: 8px;
    box-shadow: inset 0 -5px 0 #090909;
}

.weapon-barrel {
    position: absolute;
    right: 250px;
    bottom: 67px;
    width: 100px;
    height: 15px;
    background: #111;
    border-radius: 5px;
}

.weapon-handle {
    position: absolute;
    right: 80px;
    bottom: -5px;
    width: 55px;
    height: 85px;
    background: #252525;
    border-radius: 5px;
    transform: rotate(12deg);
}

.weapon-mag {
    position: absolute;
    right: 160px;
    bottom: 5px;
    width: 35px;
    height: 75px;
    background: #171717;
    transform: rotate(12deg);
    border-radius: 5px;
}

#muzzle {
    display: none;
    position: absolute;
    right: calc(7% + 345px);
    bottom: 75px;
    width: 35px;
    height: 35px;
    background: #ffb000;
    border-radius: 50%;
    box-shadow:
        0 0 15px #ff6600,
        0 0 40px #ff9900;
}

#reloadText {
    display: none;
    position: absolute;
    right: 25px;
    bottom: 70px;
    font-size: 18px;
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

    <div class="menu-box">

        <h1>WEBSTRIKE</h1>

        <p>
            3D FPS V2<br>
            Botlara karşı savaş ve skorunu yükselt.
        </p>

        <select id="quality">

            <option value="low">
                Düşük Grafik - Performans
            </option>

            <option value="medium" selected>
                Orta Grafik
            </option>

            <option value="high">
                Yüksek Grafik
            </option>

        </select>

        <p>
            WASD: Hareket<br>
            Mouse: Bakış<br>
            Sol Tık: Ateş<br>
            R: Şarjör
        </p>

        <button id="startButton">
            OYUNA BAŞLA
        </button>

    </div>

</div>

<div id="hud">

    <div id="fps">
        FPS: 0
    </div>

    <div id="help">
        WASD • Mouse • Sol Tık • R
    </div>

    <div id="crosshair"></div>

    <div id="score">
        Skor: <span id="scoreValue">0</span>
    </div>

    <div id="message"></div>

    <div id="stats">

        <div>
            CAN:
            <span id="healthText">
                100
            </span>
        </div>

        <div id="health-bar">

            <div id="health-fill"></div>

        </div>

    </div>

    <div id="ammo">

        <span id="ammoValue">
            30
        </span>

        / 120

    </div>

    <div id="reloadText">
        ŞARJÖR DEĞİŞTİRİLİYOR...
    </div>

    <div id="weapon">

        <div class="weapon-barrel"></div>

        <div class="weapon-main"></div>

        <div class="weapon-mag"></div>

        <div class="weapon-handle"></div>

    </div>

    <div id="muzzle"></div>

</div>

<div id="damage"></div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene;

let camera;

let renderer;

let clock;

let player;

let bots = [];

let keys = {};

let health = 100;

let score = 0;

let ammo = 30;

let reserveAmmo = 120;

let reloading = false;

let canShoot = true;

let gameStarted = false;

let yaw = 0;

let pitch = 0;

let fpsFrames = 0;

let fpsTime = 0;

let quality = "medium";

const menu =
    document.getElementById("menu");

const hud =
    document.getElementById("hud");

const canvas =
    document.getElementById("game");

const startButton =
    document.getElementById("startButton");

const qualitySelect =
    document.getElementById("quality");

const fpsElement =
    document.getElementById("fps");

const healthText =
    document.getElementById("healthText");

const healthFill =
    document.getElementById("health-fill");

const ammoValue =
    document.getElementById("ammoValue");

const scoreValue =
    document.getElementById("scoreValue");

const message =
    document.getElementById("message");

const damage =
    document.getElementById("damage");

const muzzle =
    document.getElementById("muzzle");

const reloadText =
    document.getElementById("reloadText");


/* =========================
   OYUN BAŞLAT
========================= */

function startGame() {

    quality =
        qualitySelect.value;

    gameStarted = true;

    menu.style.display =
        "none";

    hud.style.display =
        "block";

    init();

    canvas.requestPointerLock();

}


/* =========================
   THREE.JS
========================= */

function init() {

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(
            0x87a9c7
        );

    scene.fog =
        new THREE.Fog(
            0x87a9c7,
            30,
            120
        );


    camera =
        new THREE.PerspectiveCamera(
            75,
            window.innerWidth /
            window.innerHeight,
            0.1,
            300
        );


    let pixelRatio =
        window.devicePixelRatio;


    if (
        quality === "low"
    ) {

        pixelRatio =
            Math.min(
                pixelRatio,
                1
            );

    }

    else if (
        quality === "medium"
    ) {

        pixelRatio =
            Math.min(
                pixelRatio,
                1.5
            );

    }

    else {

        pixelRatio =
            Math.min(
                pixelRatio,
                2
            );

    }


    renderer =
        new THREE.WebGLRenderer({

            canvas:
                canvas,

            antialias:
                quality !== "low",

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(
        pixelRatio
    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    if (
        quality !== "low"
    ) {

        renderer.shadowMap.enabled =
            true;

        renderer.shadowMap.type =
            THREE.PCFSoftShadowMap;

    }


    clock =
        new THREE.Clock();


    /* IŞIK */

    const ambient =
        new THREE.HemisphereLight(
            0xffffff,
            0x444444,
            1
        );

    scene.add(
        ambient
    );


    const sun =
        new THREE.DirectionalLight(
            0xffffff,
            1.5
        );

    sun.position.set(
        30,
        50,
        20
    );


    if (
        quality !== "low"
    ) {

        sun.castShadow =
            true;

    }


    scene.add(
        sun
    );


    player = {

        position:
            new THREE.Vector3(
                0,
                1.6,
                25
            ),

        speed:
            7

    };


    camera.position.copy(
        player.position
    );


    createMap();

    createBots();

    setupControls();

    animate();

}


/* =========================
   MALZEME
========================= */

function material(
    color
) {

    return new THREE.MeshStandardMaterial({

        color:
            color,

        roughness:
            0.8

    });

}


/* =========================
   HARİTA
========================= */

function createMap() {

    /* ZEMİN */

    const floor =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                100,
                100
            ),

            material(
                0x555b60
            )

        );


    floor.rotation.x =
        -Math.PI / 2;


    if (
        quality !== "low"
    ) {

        floor.receiveShadow =
            true;

    }


    scene.add(
        floor
    );


    /* BÖLGE RENKLERİ */

    createZone(
        -25,
        0,
        20,
        25,
        0x456d8c,
        "ALFA"
    );


    createZone(
        25,
        0,
        20,
        25,
        0x8c6245,
        "BRAVO"
    );


    createZone(
        0,
        -25,
        35,
        20,
        0x4d8c5b,
        "CHARLIE"
    );


    /* DUVARLAR */

    createWall(
        0,
        2,
        -45,
        90,
        4,
        2
    );


    createWall(
        0,
        2,
        45,
        90,
        4,
        2
    );


    createWall(
        -45,
        2,
        0,
        2,
        4,
        90
    );


    createWall(
        45,
        2,
        0,
        2,
        4,
        90
    );


    /* İÇ DUVARLAR */

    createWall(
        -20,
        2,
        -10,
        25,
        4,
        2
    );


    createWall(
        20,
        2,
        -5,
        25,
        4,
        2
    );


    createWall(
        0,
        2,
        10,
        2,
        4,
        25
    );


    /* KUTULAR */

    for (
        let i = 0;
        i < 20;
        i++
    ) {

        const box =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    2,
                    2,
                    2
                ),

                material(
                    0x8b5a2b
                )

            );


        box.position.set(

            Math.random() *
            70 - 35,

            1,

            Math.random() *
            70 - 35

        );


        scene.add(
            box
        );

    }

}


/* =========================
   BÖLGE
========================= */

function createZone(
    x,
    z,
    width,
    depth,
    color,
    name
) {

    const zone =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                depth
            ),

            new THREE.MeshBasicMaterial({

                color:
                    color,

                transparent:
                    true,

                opacity:
                    0.25

            })

        );


    zone.rotation.x =
        -Math.PI / 2;


    zone.position.set(
        x,
        0.01,
        z
    );


    scene.add(
        zone
    );

}


/* =========================
   DUVAR
========================= */

function createWall(
    x,
    y,
    z,
    width,
    height,
    depth
) {

    const wall =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                width,

                height,

                depth

            ),

            material(
                0x777b80
            )

        );


    wall.position.set(
        x,
        y,
        z
    );


    if (
        quality !== "low"
    ) {

        wall.castShadow =
            true;

        wall.receiveShadow =
            true;

    }


    scene.add(
        wall
    );

}


/* =========================
   BOT OLUŞTUR
========================= */

function createBots() {

    for (
        let i = 0;
        i < 8;
        i++
    ) {

        createBot();

    }

}


function createBot() {

    const bot =
        new THREE.Group();


    /* GÖVDE */

    const body =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                0.8,
                1.2,
                0.5
            ),

            material(
                0x263d9c
            )

        );


    body.position.y =
        0.8;


    bot.add(
        body
    );


    /* KAFA */

    const head =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                0.3,
                12,
                12
            ),

            material(
                0xffc49b
            )

        );


    head.position.y =
        1.65;


    bot.add(
        head
    );


    /* DÜŞMAN SİLAHI */

    const gun =
        new THREE.Group();


    const gunBody =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                0.12,
                0.12,
                0.8
            ),

            material(
                0x171717
            )

        );


    gunBody.position.z =
        -0.45;


    gun.add(
        gunBody
    );


    const barrel =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                0.07,
                0.07,
                0.35
            ),

            material(
                0x050505
            )

        );


    barrel.position.z =
        -0.95;


    gun.add(
        barrel
    );


    gun.position.set(

        0.55,

        1,

        -0.2

    );


    gun.rotation.x =
        -0.1;


    bot.add(
        gun
    );


    /* BOT KONUMU */

    bot.position.set(

        Math.random() *
        65 - 32,

        0,

        Math.random() *
        65 - 25

    );


    bot.userData = {

        health:
            100,

        speed:
            1.2 +
            Math.random(),

        shootTimer:
            Math.random() * 3

    };


    scene.add(
        bot
    );


    bots.push(
        bot
    );

}


/* =========================
   KONTROLLER
========================= */

function setupControls() {

    document.addEventListener(
        "keydown",
        function(e) {

            keys[
                e.code
            ] = true;


            if (
                e.code === "KeyR"
            ) {

                reload();

            }

        }
    );


    document.addEventListener(
        "keyup",
        function(e) {

            keys[
                e.code
            ] = false;

        }
    );


    document.addEventListener(
        "mousemove",
        function(e) {

            if (
                document.pointerLockElement !==
                canvas
            ) {

                return;

            }


            yaw -=
                e.movementX *
                0.002;


            pitch -=
                e.movementY *
                0.002;


            pitch =
                Math.max(

                    -1.4,

                    Math.min(
                        1.4,
                        pitch
                    )

                );

        }
    );


    document.addEventListener(
        "mousedown",
        function(e) {

            if (
                e.button === 0 &&
                gameStarted
            ) {

                shoot();

            }

        }
    );


    canvas.addEventListener(
        "click",
        function() {

            if (
                gameStarted
            ) {

                canvas.requestPointerLock();

            }

        }
    );

}


/* =========================
   OYUNCU HAREKET
========================= */

function updatePlayer(
    delta
) {

    const direction =
        new THREE.Vector3();


    if (
        keys["KeyW"]
    ) {

        direction.z -= 1;

    }


    if (
        keys["KeyS"]
    ) {

        direction.z += 1;

    }


    if (
        keys["KeyA"]
    ) {

        direction.x -= 1;

    }


    if (
        keys["KeyD"]
    ) {

        direction.x += 1;

    }


    if (
        direction.lengthSq() > 0
    ) {

        direction.normalize();

    }


    const forward =
        new THREE.Vector3(

            Math.sin(yaw),

            0,

            Math.cos(yaw)

        );


    const right =
        new THREE.Vector3(

            Math.cos(yaw),

            0,

            -Math.sin(yaw)

        );


    player.position.add(

        forward.multiplyScalar(

            -direction.z *

            player.speed *

            delta

        )

    );


    player.position.add(

        right.multiplyScalar(

            direction.x *

            player.speed *

            delta

        )

    );


    player.position.x =
        Math.max(

            -42,

            Math.min(
                42,
                player.position.x
            )

        );


    player.position.z =
        Math.max(

            -42,

            Math.min(
                42,
                player.position.z
            )

        );


    camera.position.copy(
        player.position
    );


    camera.rotation.order =
        "YXZ";


    camera.rotation.y =
        yaw;


    camera.rotation.x =
        pitch;

}


/* =========================
   ATEŞ
========================= */

function shoot() {

    if (
        !canShoot ||
        reloading
    ) {

        return;

    }


    if (
        ammo <= 0
    ) {

        reload();

        return;

    }


    ammo--;

    updateHUD();


    canShoot =
        false;


    setTimeout(
        function() {

            canShoot =
                true;

        },
        110
    );


    muzzle.style.display =
        "block";


    setTimeout(
        function() {

            muzzle.style.display =
                "none";

        },
        60
    );


    const raycaster =
        new THREE.Raycaster();


    raycaster.setFromCamera(

        new THREE.Vector2(
            0,
            0
        ),

        camera

    );


    const objects = [];


    bots.forEach(
        function(bot) {

            bot.traverse(
                function(child) {

                    if (
                        child.isMesh
                    ) {

                        objects.push(
                            child
                        );

                    }

                }
            );

        }
    );


    const hits =
        raycaster.intersectObjects(
            objects
        );


    if (
        hits.length > 0
    ) {

        const hit =
            hits[0].object;


        let bot =
            hit;


        while (
            bot.parent &&
            !bot.userData.health
        ) {

            bot =
                bot.parent;

        }


        if (
            bot.userData &&
            bot.userData.health
        ) {

            bot.userData.health -=
                50;


            if (
                bot.userData.health <= 0
            ) {

                killBot(
                    bot
                );

            }

        }

    }

}


/* =========================
   BOT AI
========================= */

function updateBots(
    delta
) {

    bots.forEach(
        function(bot) {

            const distance =
                bot.position.distanceTo(
                    player.position
                );


            if (
                distance > 5
            ) {

                const direction =
                    new THREE.Vector3()
                    .subVectors(

                        player.position,

                        bot.position

                    )
                    .normalize();


                bot.position.add(

                    direction.multiplyScalar(

                        bot.userData.speed *

                        delta

                    )

                );

            }


            bot.lookAt(

                player.position.x,

                1,

                player.position.z

            );


            bot.userData.shootTimer -=
                delta;


            if (
                distance < 25 &&
                bot.userData.shootTimer <= 0
            ) {

                botShoot(
                    bot
                );


                bot.userData.shootTimer =

                    1 +

                    Math.random() *
                    2;

            }

        }
    );

}


/* =========================
   BOT ATEŞ
========================= */

function botShoot(
    bot
) {

    const distance =
        bot.position.distanceTo(
            player.position
        );


    if (
        distance > 25
    ) {

        return;

    }


    if (
        Math.random() > 0.4
    ) {

        damagePlayer(
            10
        );

    }

}


/* =========================
   BOT ÖLÜMÜ
========================= */

function killBot(
    bot
) {

    scene.remove(
        bot
    );


    bots =
        bots.filter(
            function(b) {

                return b !== bot;

            }
        );


    score +=
        100;


    updateHUD();


    setTimeout(
        function() {

            if (
                gameStarted
            ) {

                createBot();

            }

        },
        2000
    );

}


/* =========================
   OYUNCU HASAR
========================= */

function damagePlayer(
    amount
) {

    health -=
        amount;


    health =
        Math.max(
            0,
            health
        );


    damage.style.display =
        "block";


    setTimeout(
        function() {

            damage.style.display =
                "none";

        },
        120
    );


    updateHUD();


    if (
        health <= 0
    ) {

        gameOver();

    }

}


/* =========================
   RELOAD
========================= */

function reload() {

    if (
        reloading ||
        ammo >= 30 ||
        reserveAmmo <= 0
    ) {

        return;

    }


    reloading =
        true;


    reloadText.style.display =
        "block";


    setTimeout(
        function() {

            const needed =
                30 - ammo;


            const amount =
                Math.min(

                    needed,

                    reserveAmmo

                );


            ammo +=
                amount;


            reserveAmmo -=
                amount;


            reloading =
                false;


            reloadText.style.display =
                "none";


            updateHUD();

        },
        1400
    );

}


/* =========================
   HUD
========================= */

function updateHUD() {

    healthText.textContent =
        health;


    healthFill.style.width =
        health + "%";


    ammoValue.textContent =
        ammo;


    scoreValue.textContent =
        score;

}


/* =========================
   FPS
========================= */

function updateFPS(
    delta
) {

    fpsFrames++;

    fpsTime +=
        delta;


    if (
        fpsTime >= 0.5
    ) {

        const fps =
            Math.round(

                fpsFrames /
                fpsTime

            );


        fpsElement.textContent =

            "FPS: " +

            fps;


        fpsFrames =
            0;


        fpsTime =
            0;

    }

}


/* =========================
   OYUN BİTTİ
========================= */

function gameOver() {

    gameStarted =
        false;


    document.exitPointerLock();


    message.textContent =
        "ÖLDÜN!";


    setTimeout(
        function() {

            location.reload();

        },
        2500
    );

}


/* =========================
   ANİMASYON
========================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (
        !gameStarted
    ) {

        return;

    }


    const delta =
        Math.min(

            clock.getDelta(),

            0.05

        );


    updateFPS(
        delta
    );


    updatePlayer(
        delta
    );


    updateBots(
        delta
    );


    renderer.render(
        scene,
        camera
    );

}


/* =========================
   EKRAN BOYUTU
========================= */

window.addEventListener(
    "resize",
    function() {

        if (
            !camera ||
            !renderer
        ) {

            return;

        }


        camera.aspect =

            window.innerWidth /

            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

    }
);


/* =========================
   BAŞLAT
========================= */

startButton.addEventListener(
    "click",
    startGame
);

</script>
