              <h4>ODA KUR (HOST)</h4>
              <p>Arkadaşlarınla oynamak için oda oluştur.</p>
              <button id="btn-create-room" class="cs2-sec-btn">ODA OLUŞTUR</button>
              <div id="host-code-display" class="code-box hidden">ODA KODUN: <span id="my-room-code">------</span></div>
            </div>
            <div class="online-box">
              <h4>ODAYA KATIL</h4>
              <input type="text" id="join-room-code" placeholder="ODA KODUNU GİR" maxlength="6">
              <button id="btn-join-room" class="cs2-sec-btn">ODAYA KATIL</button>
            </div>
          </div>
          <div id="multi-status" class="online-status"></div>
        </div>

        <div class="cs2-controls-box">
          <div class="ctrl-cell"><span>WASD</span> HAREKET</div>
          <div class="ctrl-cell"><span>SOL TIK</span> ATEŞ ET</div>
          <div class="ctrl-cell"><span>SAĞ TIK</span> AWP ZOOM</div>
          <div class="ctrl-cell"><span>F</span> SİLAHI İNCELE</div>
          <div class="ctrl-cell"><span>R</span> ŞARJÖR DOLDUR</div>
          <div class="ctrl-cell"><span>B</span> SATIN ALMA MENÜSÜ</div>
          <div class="ctrl-cell"><span>C</span> RADYO MESAJLARI</div>
          <div class="ctrl-cell"><span>TAB</span> SKOR TABLOSU</div>
        </div>
      </div>
    </div>
